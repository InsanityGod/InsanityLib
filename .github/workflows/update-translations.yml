name: Update translations

on:
  workflow_call:
    inputs:
      MOD_LANG_PATH:
        required: true
        type: string

      TRANSLATION_ZIP:
        required: true
        type: string

      BASE_BRANCH:
        required: false
        type: string
        default: "master"

env:
  DROPBOX_FOLDER: "https://www.dropbox.com/scl/fo/q7u3idxz3edsytki8n6m4/h"
  DROPBOX_KEY: "y14td00uvfhihpqhffuagmjtd"
  TRANSLATION_BRANCH: "automation/translation-update"

jobs:
  translations:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download translations
        shell: bash
        env:
          DROPBOX_KEY: ${{ secrets.DROPBOX_KEY }}
        run: |
          URL="${DROPBOX_FOLDER}/${{ inputs.TRANSLATION_ZIP }}?rlkey=${DROPBOX_KEY}&e=1&dl=1"

          echo "Downloading ${{ inputs.TRANSLATION_ZIP }}..."

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            "$URL" \
            --output translations.zip

          ls -lh translations.zip

      - name: Extract translations
        shell: bash
        run: |
          rm -rf translations
          mkdir -p translations

          unzip -q translations.zip -d translations

          echo "Archive contents:"
          find translations -type f -print

      - name: Install translations
        shell: bash
        run: |
          mkdir -p "${{ inputs.MOD_LANG_PATH }}"

          echo "Translation JSON files:"
          find translations -type f -name '*.json' -print

          find translations \
            -type f \
            -name '*.json' \
            -exec cp {} "${{ inputs.MOD_LANG_PATH }}/" \;

          echo
          echo "Installed translations:"
          find "${{ inputs.MOD_LANG_PATH }}" \
            -maxdepth 1 \
            -type f \
            -name '*.json' \
            -printf '%f\n' \
            | sort

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git status --porcelain -- "${{ inputs.MOD_LANG_PATH }}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo "Translation changes detected:"
            git status --short -- "${{ inputs.MOD_LANG_PATH }}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No translation changes detected."
          fi

      - name: Prepare translation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${{ inputs.BASE_BRANCH }}"

          git checkout -B "$TRANSLATION_BRANCH" \
            "origin/${{ inputs.BASE_BRANCH }}"

          # Reinstall translations after switching branches
          find translations \
            -type f \
            -name '*.json' \
            -exec cp {} "${{ inputs.MOD_LANG_PATH }}/" \;

      - name: Commit translations
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git add "${{ inputs.MOD_LANG_PATH }}"
          git commit -m "Update translations"

      - name: Push translation branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git push --force \
            origin \
            "HEAD:${TRANSLATION_BRANCH}"

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          PR_NUMBER="$(
            gh pr list \
              --head "$TRANSLATION_BRANCH" \
              --base "${{ inputs.BASE_BRANCH }}" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base "${{ inputs.BASE_BRANCH }}" \
              --head "$TRANSLATION_BRANCH" \
              --title "Update translations" \
              --body "Automated update of translations."
          else
            echo "Pull request #${PR_NUMBER} already exists."
          fi
